esphome:
  name: humidity-offset
  project:
    name: curtistinkers.humidity-offset
    version: 1.0.0

number:
  - platform: template
    name: ${humidity_name} Offset
    id: number_humidity_offset_${sensor_id}
    min_value: -10
    max_value: 10
    step: 0.1
    initial_value: 0
    icon: "mdi:water-check"
    unit_of_measurement: "%"
    entity_category: config
    optimistic: true
    mode: BOX
    restore_value: true
    disabled_by_default: true
    on_value:
      - then:
          - logger.log:
              format: "${humidity_name} Offset changed to %.0f"
              args:
                - x
              level: INFO
              tag: Environment
          - logger.log:
              format: "${humidity_name} has changed from %.0f to %.0f"
              args:
                - id(sensor_dht_humidity_${sensor_id}).state
                - id(sensor_dht_humidity_${sensor_id}).state + x
              level: INFO
              tag: Environment
          - component.update: sensor_dht_${sensor_id}
